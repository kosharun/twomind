<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Twomind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230b0b0f'/><circle cx='11' cy='16' r='5' fill='%233dd6ec'/><circle cx='21' cy='16' r='5' fill='%23b3a4ff'/></svg>"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">
          <span class="dots"><i></i><i></i></span>
          twomind
        </span>
        <span class="brand-project" id="project-name"></span>
        <nav class="nav" id="nav">
          <button data-screen="catchup" class="on">Catch up</button>
          <button data-screen="story">Changes</button>
          <button data-screen="map">Code map</button>
        </nav>
      </div>
      <div class="topbar-right">
        <span class="live" id="live"><span class="dot"></span> live</span>
        <button class="btn" id="theme-btn">light</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="sidebar-head">
          <span class="label">Changes</span>
          <span class="label" id="story-count"></span>
        </div>
        <div id="story-list"></div>
      </aside>
      <section class="screen" id="screen"><div class="empty">Loading…</div></section>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
